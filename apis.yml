name: Hangry
description: >-
  Hangry is an Indonesian multi-brand virtual restaurant and cloud-kitchen
  company founded in 2019 and backed by 500 Global. It designs, operates, and
  delivers a portfolio of consumer food brands - including Moon Chicken, San
  Gyu, Ayam Koplo, Dari Pada, Wai Thai, Pizza Gang, and Accha - engineered to be
  tasty, consistent, and affordable for the mass market and sold primarily
  through third-party food-delivery channels. Hangry operates as a
  direct-to-consumer food and beverage business rather than an API or developer
  platform provider; it publishes no public developer portal, API
  documentation, or machine-readable API surface. This profile was surfaced as a
  500 Global portfolio company and added to the API Evangelist network for
  enrichment tracking.
